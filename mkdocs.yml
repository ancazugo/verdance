site_name: verdance
site_description: Measure the 3-30-300 rule of urban greening for any city, using Apache Sedona
site_url: https://sdgresearch.github.io/verdance/
repo_url: https://github.com/sdgresearch/verdance
repo_name: sdgresearch/verdance

# Internal design documents and implementation plans live under docs/ so they
# travel with the code, but they are not part of the published site.
exclude_docs: |
  superpowers/

theme:
  name: material
  logo: assets/logos/verdance-icon-mono-inverse.svg
  favicon: assets/logos/verdance-icon-light.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy

extra_css:
  - assets/stylesheets/verdance.css

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          # `paths` is a handler-level key, a sibling of `options` — nested
          # inside `options` it is silently ignored. It lets Griffe read the
          # package statically, so the docs build never installs the project.
          paths: ["src"]
          options:
            docstring_style: google
            filters: ["!^_"]
            show_source: true
            show_root_full_path: false
            members_order: source

nav:
  - Home: index.md
  - Installation: installation.md
  - Quick start: quickstart.md
  - Configuration: configuration.md
  - Modules: modules.md
  - Data sources: data-sources.md
  - Visualising results: visualising.md
  - API reference:
      - api/index.md
      - Analysis modules: api/analysis.md
      - Pipeline: api/pipeline.md
      - Data sources: api/data-sources.md
      - Optional modules: api/optional.md
      - Utilities: api/utils.md
