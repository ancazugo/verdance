name: CI

# Runs the test suite and lint checks on every push to master and on PRs.
# The test job needs Java 17 (Apache Sedona / PySpark) and lets Sedona
# download its jars on first run (network is available on GitHub runners).

on:
  push:
    branches: [master]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      # Keep caches and temp files on the runner's scratch disk, as the
      # project expects (never under $HOME or the repo).
      TMPDIR: ${{ runner.temp }}
      VERDANCE_CACHE_DIR: ${{ runner.temp }}/verdance_cache
      VERDANCE_IVY_DIR: ${{ runner.temp }}/ivy2
      VERDANCE_DUCKDB_EXTENSIONS: ${{ runner.temp }}/duckdb-ext
      # Spark runs locally on the runner; keep its heap modest.
      SPARK_DRIVER_MEMORY: 3g
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17 (Spark / Sedona)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Create cache directories
        run: mkdir -p "$VERDANCE_CACHE_DIR" "$VERDANCE_IVY_DIR" "$VERDANCE_DUCKDB_EXTENSIONS"

      - name: Install the project and dev dependencies
        run: uv sync --python ${{ matrix.python-version }} --dev

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest -q

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      # `ruff check` enforces the rules configured in pyproject.toml
      # ([tool.ruff]); it is the blocking lint gate.
      - name: Ruff check
        run: uvx ruff check . --output-format=github

      # Formatting is not yet enforced: the existing code is not ruff-formatted,
      # so this step only reports drift and never fails the build. Drop
      # `continue-on-error` once the codebase has been formatted.
      - name: Ruff format (advisory)
        continue-on-error: true
        run: uvx ruff format --check .
